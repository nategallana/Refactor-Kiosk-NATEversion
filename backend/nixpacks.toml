providers = ["php", "node"]

[variables]
NIXPACKS_PHP_VERSION = "8.4"

[phases.setup]
nixPkgs = [
    "php84",
    "php84Packages.composer",
    "php84Extensions.pdo_sqlite",
    "php84Extensions.sqlite3",
    "php84Extensions.mbstring",
    "php84Extensions.xml",
    "php84Extensions.curl",
    "php84Extensions.tokenizer",
    "php84Extensions.bcmath",
    "php84Extensions.ctype",
    "php84Extensions.fileinfo"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --ignore-platform-req=php+"
]

[phases.build]
cmds = [
    "mkdir -p storage/framework/{sessions,views,cache}",
    "mkdir -p storage/logs",
    "mkdir -p database",
    "touch database/database.sqlite",
    "cp -n .env.example .env || true",
    "php artisan config:clear",
    "php artisan migrate --force",
    "php artisan db:seed --force"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
