[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo_sqlite", "php84Extensions.sqlite3", "php84Extensions.mbstring", "php84Extensions.xml", "php84Extensions.curl", "php84Extensions.tokenizer", "php84Extensions.bcmath", "php84Extensions.ctype", "php84Extensions.fileinfo"]

[phases.build]
cmds = [
    "mkdir -p /app/storage/framework/{sessions,views,cache}",
    "mkdir -p /app/storage/logs",
    "mkdir -p /app/database",
    "touch /app/database/database.sqlite",
    "composer install --no-dev --optimize-autoloader",
    "cp .env.example .env || true",
    "php artisan key:generate --force",
    "php artisan config:clear",
    "php artisan migrate --force",
    "php artisan db:seed --force"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
